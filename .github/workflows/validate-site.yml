name: Validate site build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Check generated pages
        run: |
          ls _site
          test -f _site/index.html
          test -f _site/publications/index.html
          test -f _site/cv/index.html
          test "$(find _site/publication -name index.html | wc -l)" -eq 6
          for title in "SynLogic" "On the Perception Bottleneck of VLMs for Chart Understanding" "On the Universal Truthfulness Hyperplane Inside LLMs" "In-Context Sharpness as Alerts" "C-Eval" "Composing Parameter-Efficient Modules with Arithmetic Operations"; do
            grep -q "$title" _site/index.html
            grep -q "$title" _site/publications/index.html
            grep -q "$title" _site/cv/index.html
          done
          grep -q "jliugi@connect.ust.hk" _site/index.html
          grep -q "MINIMAX" _site/index.html
          if grep -rq "Paper Title Number" _site; then exit 1; fi
