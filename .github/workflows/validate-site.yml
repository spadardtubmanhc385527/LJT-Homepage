name: Validate site build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Check generated pages
        run: |
          echo "Publication pages:"
          find _site/publication -name index.html
          count=$(find _site/publication -name index.html | wc -l)
          echo "Publication page count: $count"
          test "$count" -eq 6
          test -f _site/index.html
          test -f _site/publications/index.html
          test -f _site/cv/index.html
          for page in _site/index.html _site/publications/index.html _site/cv/index.html; do
            echo "== Checking $page =="
            for title in "SynLogic" "On the Perception Bottleneck of VLMs for Chart Understanding" "On the Universal Truthfulness Hyperplane Inside LLMs" "In-Context Sharpness as Alerts" "C-Eval" "Composing Parameter-Efficient Modules with Arithmetic Operations"; do
              if grep -qF "$title" "$page"; then
                echo "OK: $title"
              else
                echo "MISSING: $title"
                exit 1
              fi
            done
            if grep -qF "Paper Title Number" "$page"; then
              echo "Demo publication content found in $page"
              exit 1
            fi
          done
          grep -qF "jliugi@connect.ust.hk" _site/index.html
          grep -qF "MINIMAX" _site/index.html
          echo "All checks passed."
